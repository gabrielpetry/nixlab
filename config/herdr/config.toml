onboarding = false

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+b"
new_tab = ["prefix+ctrl+c", "alt+n"]
rename_tab = "prefix+r"
previous_tab = ["prefix+shift+h", "alt+h"]
next_tab = ["prefix+shift+l", "alt+l", "alt+0"]
switch_tab = ["prefix+1..9", "alt+1..9"]
workspace_picker = ["prefix+w", "prefix+ctrl+w"]
reload_config = "prefix+shift+r"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+minus", "prefix+shift+s"]
split_horizontal = ["prefix+|", "prefix+s"]
zoom = "prefix+z"
