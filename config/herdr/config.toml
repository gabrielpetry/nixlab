onboarding = false

[theme]
name = "catppuccin"

[ui]
prompt_new_tab_name = false

[keys]
prefix = "ctrl+b"
new_tab = ["prefix+ctrl+c", "alt+n"]
rename_tab = "prefix+r"
previous_tab = ["prefix+shift+h", "alt+h"]
next_tab = ["prefix+shift+l", "alt+l", "alt+0"]
switch_tab = ["prefix+1..9", "alt+1..9"]
workspace_picker = ["prefix+w", "prefix+ctrl+w"]
reload_config = "prefix+shift+r"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+minus", "prefix+shift+s"]
split_horizontal = ["prefix+|", "prefix+s"]
zoom = "prefix+z"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "herdr-pane-navigate left ctrl+h"
description = "Focus left pane"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "herdr-pane-navigate down ctrl+j"
description = "Focus pane below"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "herdr-pane-navigate up ctrl+k"
description = "Focus pane above"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "herdr-pane-navigate right ctrl+l"
description = "Focus right pane"
